[project]
name = "codex-subscription-client"
version = "0.2.1"
description = "Reusable ChatGPT/Codex OAuth authentication and subscription model client."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
codex-subscription = "codex_subscription.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
