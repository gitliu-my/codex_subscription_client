[project]
name = "codex-subscription-client"
version = "0.3.0"
description = "Reusable ChatGPT/Codex OAuth authentication and subscription model client."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
codex-subscription = "codex_subscription.cli:main"
codex-subscription-app = "codex_subscription.app:main"

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
