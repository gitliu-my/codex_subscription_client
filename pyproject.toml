[project]
name = "codex-subscription-client"
version = "0.4.0"
description = "Reusable ChatGPT/Codex OAuth authentication and subscription model client."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/gitliu-my/codex_subscription_client"
Repository = "https://github.com/gitliu-my/codex_subscription_client"
Issues = "https://github.com/gitliu-my/codex_subscription_client/issues"

[project.scripts]
codex-subscription = "codex_subscription.cli:main"
codex-subscription-app = "codex_subscription.app:main"

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
