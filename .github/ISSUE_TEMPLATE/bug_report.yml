name: Bug report
description: Report a reproducible defect without including credentials
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include OAuth tokens, API keys, account IDs, or unredacted auth files.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: entrypoint
    attributes:
      label: Entry point
      options:
        - Python SDK
        - CLI
        - Local API
        - macOS App
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use synthetic or redacted values only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
