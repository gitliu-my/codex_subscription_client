name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-x86-64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Verify release version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "v${version}" = "$GITHUB_REF_NAME"
          test "$(uname -m)" = "x86_64"
      - name: Test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m unittest discover -s tests -v
      - name: Build and package
        run: |
          ./scripts/build_linux.sh
          ./scripts/package_linux_release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: csub-linux-x86-64
          path: release/csub-linux-x86_64.tar.gz
          if-no-files-found: error

  macos-arm64:
    needs: linux-x86-64
    runs-on: macos-15
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Verify release version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "v${version}" = "$GITHUB_REF_NAME"
          test "$(uname -m)" = "arm64"
      - name: Test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m unittest discover -s tests -v
      - name: Build and package
        run: |
          ./scripts/build_macos.sh
          ./scripts/package_macos_release.sh
      - uses: actions/download-artifact@v4
        with:
          name: csub-linux-x86-64
          path: release
      - name: Create combined checksums
        run: |
          cd release
          shasum -a 256 csub-macos-arm64.tar.gz csub-linux-x86_64.tar.gz > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/csub-macos-arm64.tar.gz \
            release/csub-linux-x86_64.tar.gz \
            release/SHA256SUMS \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            --verify-tag
      - name: Update Homebrew tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          version=${GITHUB_REF_NAME#v}
          sha256=$(awk '$2 == "csub-macos-arm64.tar.gz" {print $1}' release/SHA256SUMS)
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/gitliu-my/homebrew-tap.git" tap
          python scripts/render_homebrew_formula.py \
            --version "$version" \
            --arm64-sha256 "$sha256" \
            --output tap/Formula/csub.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/csub.rb
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update csub to v${version}"
          git push origin main
      - name: Note manual Homebrew update
        if: env.HOMEBREW_TAP_TOKEN == ''
        run: |
          echo "::notice::HOMEBREW_TAP_TOKEN is not configured; update Formula/csub.rb manually."
